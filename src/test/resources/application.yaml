spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  security:
    jwt:
      issuer: https://securetoken.google.com/local-dev
      audience: local-dev
      hmac-secret: change-me-dev-secret-change-me-dev-secret

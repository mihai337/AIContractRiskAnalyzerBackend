spring:
  application:
    name: AIContractRiskAnalyzerBackend

  jackson:
    mapper:
      # RiskLevel/etc. serialize via toString() (lowercase) but the app sends enum
      # names (uppercase). Accept either case so the contract-sync round-trip works.
      accept-case-insensitive-enums: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydatabase}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:https://securetoken.google.com/aicontractriskanalyser}
          audiences: ${JWT_AUDIENCE:aicontractriskanalyser}

  cloud:
    gcp:
      credentials:
        location: classpath:aicontractriskanalyser-firebase-adminsdk.json

  session:
    jdbc:
      initialize-schema: always

  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  ml:
    enabled: ${ML_ENABLED:true}
    base-url: ${ML_BASE_URL:http://localhost:8000}
    extract-text-path: ${ML_EXTRACT_PATH:/v1/ml/extract-text}
    analyze-text-path: ${ML_ANALYZE_PATH:/v1/ml/analyze-text}
    embedding-path: ${ML_EMBED_PATH:/v1/ml/embedding}
    api-key: ${ML_API_KEY:}
    fail-open: ${ML_FAIL_OPEN:true}
    connect-timeout-ms: ${ML_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ML_READ_TIMEOUT_MS:120000}
  llm:
    enabled: ${LLM_ENABLED:true}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4.1-mini}
    temperature: ${LLM_TEMPERATURE:0.2}
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:800}
    connect-timeout-ms: ${LLM_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${LLM_READ_TIMEOUT_MS:120000}
    fail-open: ${LLM_FAIL_OPEN:false}

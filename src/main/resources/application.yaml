spring:
  application:
    name: AIContractRiskAnalyzerBackend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydatabase}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:https://securetoken.google.com/aicontractriskanalyser}
          audiences: ${JWT_AUDIENCE:aicontractriskanalyser}

  cloud:
    gcp:
      credentials:
        location: classpath:aicontractriskanalyser-firebase-adminsdk-fbsvc-3402fe4af4.json

  session:
    jdbc:
      initialize-schema: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  ml:
    enabled: ${ML_ENABLED:true}
    base-url: ${ML_BASE_URL:http://localhost:8000}
    extract-text-path: ${ML_EXTRACT_PATH:/v1/ml/extract-text}
    analyze-text-path: ${ML_ANALYZE_PATH:/v1/ml/analyze-text}
    api-key: ${ML_API_KEY:}
    fail-open: ${ML_FAIL_OPEN:true}
    connect-timeout-ms: ${ML_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ML_READ_TIMEOUT_MS:120000}
  analysis:
    async:
      core-pool-size: ${ANALYSIS_ASYNC_CORE_POOL_SIZE:2}
      max-pool-size: ${ANALYSIS_ASYNC_MAX_POOL_SIZE:4}
      queue-capacity: ${ANALYSIS_ASYNC_QUEUE_CAPACITY:100}
